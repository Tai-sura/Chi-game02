<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Uni+ 戰馬奔騰 · 雙軌破障跑酷</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --horse-w: clamp(3.6rem, 8vmin, 6.5rem);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }
    body {
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow: hidden;
    }
    /* 矮視窗改為整頁滾動，避免舞台被裁掉 */
    @media (max-height: 560px) {
      body {
        height: auto;
        max-height: none;
        min-height: 100dvh;
        overflow-y: auto;
      }
      #game-stage {
        flex: 1 0 13rem;
        min-height: 13rem;
      }
    }
    @keyframes track-move {
      0% { background-position-x: 0; }
      100% { background-position-x: -400px; }
    }
    .road-scrolling {
      background:
        repeating-linear-gradient(90deg, rgba(148,163,184,0.12) 0 18px, transparent 18px 48px),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 14px);
      animation: track-move var(--road-duration, 1.45s) linear infinite;
    }
    .road-paused { animation-play-state: paused !important; }

    @keyframes parallax-far {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes parallax-mid {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    .parallax-far { animation: parallax-far 48s linear infinite; }
    .parallax-mid { animation: parallax-mid 22s linear infinite; }
    .parallax-paused { animation-play-state: paused !important; }

    @keyframes gallop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .horse-gallop { animation: gallop 0.28s infinite ease-in-out; will-change: transform; }
    .horse-paused { animation-play-state: paused !important; }

    @keyframes impact-shake {
      0%, 100% { transform: translate(0, 0); }
      20% { transform: translate(-6px, 4px); }
      40% { transform: translate(6px, -4px); }
      60% { transform: translate(-4px, 2px); }
      80% { transform: translate(2px, -2px); }
    }
    .shake { animation: impact-shake 0.25s ease-in-out; }

    @keyframes flag-wave {
      0%, 100% { transform: skewY(0deg) translateX(0); }
      50% { transform: skewY(-2deg) translateX(2px); }
    }
    .flag-cloth { animation: flag-wave 0.9s ease-in-out infinite; transform-origin: left center; }

    @keyframes tear-correct {
      0% { opacity: 1; transform: scale(1) rotate(0deg); filter: none; }
      40% { opacity: 1; transform: scale(1.15) rotate(-8deg) skewX(-12deg); filter: brightness(1.4); }
      100% { opacity: 0; transform: scale(1.6) rotate(18deg) skewX(20deg); filter: blur(2px); }
    }
    @keyframes tear-wrong {
      0% { opacity: 1; transform: translateX(0); filter: none; }
      20% { transform: translateX(-4px); filter: drop-shadow(0 0 8px #f43f5e); }
      40% { transform: translateX(5px); }
      60% { transform: translateX(-3px) scale(0.95); }
      100% { opacity: 0; transform: scale(0.6); filter: brightness(2); }
    }
    .tear-correct { animation: tear-correct 0.45s ease-out forwards; }
    .tear-wrong { animation: tear-wrong 0.4s ease-out forwards; }

    /* 關鍵：绝不在同一元素同時使用 CSS filter + transform 動畫（手機會拆壞圖形） */
    #horse-player {
      position: absolute;
      left: 5%;
      z-index: 20;
      width: var(--horse-w);
      height: calc(var(--horse-w) * 0.9);
      margin-top: calc(var(--horse-w) * -0.45);
      transition: top 0.15s ease-out;
      pointer-events: none;
    }
    @media (min-width: 640px) {
      #horse-player { left: 2.5rem; }
    }
    @media (min-width: 768px) {
      #horse-player { left: 4rem; }
    }
    .horse-bob {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* 發光放在獨立偽元素，不掛在奔馳動畫層上 */
    .horse-bob::before {
      content: '';
      position: absolute;
      inset: 8% 4%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(148,163,184,0.35) 0%, transparent 70%);
      z-index: 0;
      pointer-events: none;
    }
    .horse-hot.horse-bob::before {
      background: radial-gradient(ellipse, rgba(251,191,36,0.45) 0%, transparent 70%);
    }
    .horse-emoji {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      pointer-events: none;
      user-select: none;
      /* 固定電腦版馬圖，不跟系統繪文字走，也不加 filter / transform */
      filter: none !important;
      transform: none;
    }

    .ink-mask {
      background:
        radial-gradient(ellipse at 30% 20%, rgba(251,191,36,0.08), transparent 45%),
        radial-gradient(ellipse at 70% 80%, rgba(14,165,233,0.08), transparent 40%),
        rgba(2, 6, 23, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    @keyframes verse-glow-in {
      0% { opacity: 0; transform: translateY(8px) scale(0.96); filter: drop-shadow(0 0 0 transparent); }
      40% { opacity: 1; transform: translateY(0) scale(1.02); filter: drop-shadow(0 0 10px rgba(251,191,36,0.85)); }
      100% { opacity: 1; transform: translateY(0) scale(1); filter: drop-shadow(0 0 4px rgba(52,211,153,0.45)); }
    }
    .verse-enter { animation: verse-glow-in 0.65s ease-out forwards; }

    .scroll-ink::-webkit-scrollbar { width: 4px; height: 4px; }
    .scroll-ink::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.35); border-radius: 999px; }
    .scroll-ink::-webkit-scrollbar-track { background: transparent; }

    .gear-btn {
      padding: 0.28rem 0.5rem;
      border-radius: 999px;
      font-size: clamp(9px, 2.6vw, 11px);
      font-weight: 900;
      border: 1px solid transparent;
      transition: all 0.15s;
      white-space: nowrap;
      line-height: 1.2;
    }
    .gear-btn.active-slow {
      background: rgba(16,185,129,0.25);
      border-color: #34d399;
      color: #6ee7b7;
      box-shadow: 0 0 10px rgba(16,185,129,0.35);
    }
    .gear-btn.active-mid {
      background: rgba(245,158,11,0.25);
      border-color: #fbbf24;
      color: #fcd34d;
      box-shadow: 0 0 10px rgba(245,158,11,0.35);
    }
    .gear-btn.active-fast {
      background: rgba(244,63,94,0.25);
      border-color: #fb7185;
      color: #fda4af;
      box-shadow: 0 0 10px rgba(244,63,94,0.4);
    }
    .gear-btn:not(.active-slow):not(.active-mid):not(.active-fast) {
      background: rgba(30,41,59,0.8);
      border-color: #334155;
      color: #94a3b8;
    }

    #sky-layer { transition: background 1.5s ease; }
    #game-stage { transition: box-shadow 0.45s ease; }
    #game-stage.rhetoric-streak {
      box-shadow: 0 0 0 2px #fbbf24, 0 0 28px rgba(251,191,36,0.55);
    }
    .rhetoric-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.08rem 0.45rem;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.08em;
      color: #fde68a;
      background: rgba(251,191,36,0.16);
      border: 1px solid rgba(251,191,36,0.75);
      box-shadow: 0 0 12px rgba(251,191,36,0.45);
      white-space: nowrap;
    }
    .rhetoric-pill-court {
      color: #d6f5e3;
      background: rgba(16,185,129,0.14);
      border-color: rgba(214,180,138,0.8);
      box-shadow: 0 0 12px rgba(180,140,70,0.4);
    }
    .scene-chip {
      font-size: 10px;
      font-weight: 800;
      color: #e2e8f0;
      background: rgba(15,23,42,0.45);
      border: 1px solid rgba(226,232,240,0.25);
      border-radius: 999px;
      padding: 0.05rem 0.4rem;
      white-space: nowrap;
    }
    .story-fx { opacity: 0; transition: opacity 1.5s ease; }
    .story-fx.stars,
    .story-fx.embers,
    .story-fx.petals { opacity: 1; }
    .story-fx.stars::before,
    .story-fx.embers::before,
    .story-fx.petals::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .story-fx.stars::before {
      background-image:
        radial-gradient(1.4px 1.4px at 12% 22%, #fff, transparent),
        radial-gradient(1.2px 1.2px at 28% 14%, #e0f2fe, transparent),
        radial-gradient(1.6px 1.6px at 46% 30%, #fff, transparent),
        radial-gradient(1px 1px at 63% 18%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 78% 28%, #e0f2fe, transparent),
        radial-gradient(1.2px 1.2px at 88% 12%, #fff, transparent),
        radial-gradient(1px 1px at 18% 42%, #fff, transparent),
        radial-gradient(1.3px 1.3px at 54% 8%, #fff, transparent);
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .story-fx.embers::before {
      background-image: radial-gradient(circle, #fb7185 1.3px, transparent 1.8px);
      background-size: 42px 56px;
      animation: ember-rise 7s linear infinite;
      opacity: 0.55;
    }
    .story-fx.petals::before {
      background-image: radial-gradient(circle, #fda4af 1.5px, transparent 2px);
      background-size: 52px 70px;
      animation: petal-fall 9s linear infinite;
      opacity: 0.5;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
    @keyframes ember-rise {
      from { transform: translateY(12%); }
      to { transform: translateY(-18%); }
    }
    @keyframes petal-fall {
      from { transform: translateY(-16%); }
      to { transform: translateY(14%); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col items-stretch font-sans select-none touch-manipulation">

  <!-- 頂部 HUD -->
  <header class="w-full shrink-0 px-3 sm:px-4 py-1.5 flex flex-wrap justify-between items-center gap-x-3 gap-y-1 z-20 bg-slate-900/90 border-b border-slate-800 backdrop-blur">
    <div class="flex items-center space-x-2 min-w-0">
      <span class="bg-amber-500 text-slate-950 font-black text-xs px-2 py-0.5 rounded shadow shrink-0">Uni+ 跑酷獵場</span>
      <span id="poem-title" class="text-xs md:text-sm font-bold text-amber-400 truncate">木蘭詩</span>
    </div>

    <div class="flex items-center flex-wrap justify-end gap-2 md:gap-3 shrink-0">
      <button id="pause-btn" onclick="togglePause()"
        class="px-2.5 py-1 rounded-lg bg-cyan-500/15 border-2 border-cyan-400 text-cyan-200 text-[11px] md:text-xs font-black hover:bg-cyan-500/25 active:scale-95 transition-all shadow-[0_0_12px_rgba(34,211,238,0.25)]">
        ⏸️ 勒馬調息
      </button>
      <div class="flex items-center space-x-1.5" id="hp-wrap">
        <span id="hp-label" class="text-[10px] sm:text-xs text-slate-400 font-bold">心力</span>
        <span id="hp-mood" class="hidden text-[10px] text-rose-300/90 font-bold">伴君如伴虎</span>
        <div class="w-14 md:w-24 bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
          <div id="hp-bar" class="bg-gradient-to-r from-emerald-400 to-teal-400 h-full w-full transition-all duration-300"></div>
        </div>
      </div>
      <div class="bg-slate-800/80 border border-slate-600 px-2 py-0.5 rounded-full text-[11px] font-black text-sky-300">
        積分 <span id="score-display" class="text-sm text-white">0</span>
      </div>
      <div class="bg-amber-500/20 border border-amber-500/50 px-2 py-0.5 rounded-full text-xs font-black text-amber-300">
        🔥 <span id="combo-display" class="text-base text-white">0</span>
      </div>
    </div>
  </header>

  <!-- 關卡切換 + 配速檔位 -->
  <div class="w-full shrink-0 px-3 sm:px-4 pt-1.5 flex flex-wrap items-end justify-between gap-2 z-20">
    <div class="flex gap-2">
      <button onclick="switchPoem('mulan')" id="tab-mulan" class="px-3 py-1 text-xs font-black rounded-t-lg bg-amber-500 text-slate-950 transition-all">
        🐎 木蘭詩（雙軌出征）
      </button>
      <button onclick="switchPoem('yangxiu')" id="tab-yangxiu" class="px-3 py-1 text-xs font-black rounded-t-lg bg-slate-800 text-slate-400 hover:text-white transition-all">
        🗡️ 楊修之死（文言字詞）
      </button>
    </div>
    <div class="flex items-center gap-1.5 pb-0.5 relative z-40" title="鍵盤 [ 減速 · ] 加速">
      <span class="text-[10px] text-slate-500 font-bold hidden sm:inline">配速</span>
      <div id="gear-bar" class="flex items-center gap-1 bg-slate-900/90 border border-slate-700 rounded-full p-0.5 pointer-events-auto">
        <button type="button" id="gear-0" class="gear-btn active-slow">🟢 漫步 ×1.0</button>
        <button type="button" id="gear-1" class="gear-btn">🟡 疾馳 ×1.5</button>
        <button type="button" id="gear-2" class="gear-btn">🔴 狂熱 ×2.5</button>
      </div>
    </div>
  </div>

  <main class="w-full flex-1 min-h-0 px-2 sm:px-3 lg:px-4 pb-2 flex flex-col justify-start gap-0">
    <!-- 句條 + 文法鷹架 -->
    <div class="shrink-0 bg-slate-900 border-t-2 border-x-2 border-slate-800 rounded-t-2xl py-1.5 px-3 sm:px-4 flex flex-col gap-1">
      <div class="flex justify-between items-center text-xs gap-2">
        <span class="flex items-center gap-1.5 min-w-0 flex-wrap">
          <span id="line-progress" class="text-amber-500 font-extrabold shrink-0">第 1 / 16 聯</span>
          <span id="scene-chip" class="scene-chip hidden">閨房籌備</span>
          <span id="rhetoric-tag" class="rhetoric-pill hidden">【疊詞】</span>
        </span>
        <span class="text-slate-500 text-[11px] hidden md:inline shrink-0">W/S · Space · [ ]</span>
      </div>
      <div id="sentence-preview" class="font-black text-2xl md:text-3xl flex flex-wrap items-center justify-center gap-x-1 gap-y-1 min-h-[3rem]"></div>
    </div>

    <!-- 跑酷舞台 -->
    <div id="game-stage" class="relative w-full flex-1 min-h-[11rem] border-2 border-slate-800 rounded-b-2xl overflow-hidden shadow-2xl">
      <div id="sky-layer" class="absolute inset-0"></div>
      <div id="story-fx" class="story-fx absolute inset-0 pointer-events-none"></div>

      <div id="parallax-far" class="absolute bottom-[12%] left-0 h-[42%] w-[200%] opacity-40 pointer-events-none parallax-far">
        <svg class="w-1/2 h-full inline-block" viewBox="0 0 800 200" preserveAspectRatio="none">
          <path d="M0,200 L80,110 L160,150 L260,70 L360,140 L450,55 L560,130 L680,80 L800,200 Z" fill="#334155"></path>
        </svg>
        <svg class="w-1/2 h-full inline-block" viewBox="0 0 800 200" preserveAspectRatio="none">
          <path d="M0,200 L100,90 L200,145 L300,60 L420,135 L520,50 L640,120 L740,75 L800,200 Z" fill="#334155"></path>
        </svg>
      </div>
      <div id="parallax-mid" class="absolute bottom-[8%] left-0 h-[32%] w-[200%] opacity-55 pointer-events-none parallax-mid">
        <svg class="w-1/2 h-full inline-block" viewBox="0 0 800 140" preserveAspectRatio="none">
          <path d="M0,140 L60,90 L140,115 L220,55 L320,100 L420,45 L530,95 L650,60 L740,100 L800,140 Z" fill="#1e293b"></path>
          <ellipse id="sun-orb" cx="620" cy="48" rx="28" ry="28" fill="#f59e0b" opacity="0.35"></ellipse>
        </svg>
        <svg class="w-1/2 h-full inline-block" viewBox="0 0 800 140" preserveAspectRatio="none">
          <path d="M0,140 L90,85 L180,110 L280,50 L380,95 L480,40 L590,90 L700,55 L800,140 Z" fill="#1e293b"></path>
        </svg>
      </div>
      <div id="wave-layer" class="absolute bottom-[6%] left-0 right-0 h-[14%] opacity-30 pointer-events-none hidden">
        <svg class="w-full h-full" viewBox="0 0 800 40" preserveAspectRatio="none">
          <path d="M0,28 Q50,10 100,28 T200,28 T300,28 T400,28 T500,28 T600,28 T700,28 T800,28 V40 H0 Z" fill="#38bdf8"></path>
        </svg>
      </div>

      <div id="road-layer" class="absolute bottom-0 left-0 right-0 h-[55%] road-scrolling opacity-40 pointer-events-none"></div>
      <div class="absolute top-1/2 left-0 right-0 h-1 border-b-2 border-dashed border-amber-500/25 -translate-y-1/2 pointer-events-none z-10"></div>
      <div class="absolute left-3 top-1/4 -translate-y-1/2 text-slate-600 font-black text-xs pointer-events-none z-10">上道 (W / ↑)</div>
      <div class="absolute left-3 top-3/4 -translate-y-1/2 text-slate-600 font-black text-xs pointer-events-none z-10">下道 (S / ↓)</div>

      <canvas id="fx-canvas" class="absolute inset-0 pointer-events-none z-30"></canvas>

      <div id="horse-player" style="top: 25%;">
        <!-- 奔馳動畫只在外層；馬圖本身不做 CSS filter，避免手機碎圖 -->
        <div id="horse-visual" class="horse-bob horse-gallop" aria-label="戰馬衝刺">
          <img class="horse-emoji" src="horse.png" alt="" draggable="false">
        </div>
      </div>

      <div id="flags-group" class="absolute inset-0 pointer-events-none z-10">
        <div id="flag-top" class="absolute flex items-end" style="top: 25%; right: -220px; transform: translateY(-50%);">
          <div class="flag-pole w-1.5 h-14 md:h-20 bg-gradient-to-b from-amber-700 to-amber-950 rounded-full shadow mr-0.5"></div>
          <div id="flag-top-cloth" class="flag-cloth bg-gradient-to-r from-rose-950 to-slate-900 border-2 border-rose-500 text-rose-200 font-black text-base md:text-xl px-4 py-2 rounded-r-xl shadow-lg flex items-center gap-1.5">
            <span>🚩</span><span id="flag-top-text">默默</span>
          </div>
        </div>
        <div id="flag-bottom" class="absolute flex items-end" style="top: 75%; right: -220px; transform: translateY(-50%);">
          <div class="flag-pole w-1.5 h-14 md:h-20 bg-gradient-to-b from-amber-700 to-amber-950 rounded-full shadow mr-0.5"></div>
          <div id="flag-bottom-cloth" class="flag-cloth bg-gradient-to-r from-cyan-950 to-slate-900 border-2 border-cyan-500 text-cyan-200 font-black text-base md:text-xl px-4 py-2 rounded-r-xl shadow-lg flex items-center gap-1.5">
            <span>🚩</span><span id="flag-bottom-text">唧唧</span>
          </div>
        </div>
      </div>

      <div class="absolute inset-0 flex flex-col z-20 opacity-0 md:hidden">
        <div class="flex-1" onclick="changeLane(0)"></div>
        <div class="flex-1" onclick="changeLane(1)"></div>
      </div>

      <div id="feedback-text" class="absolute left-1/3 top-1/2 -translate-y-1/2 font-black text-xl md:text-3xl italic opacity-0 transition-all pointer-events-none z-40">破陣！</div>

      <!-- 暫停調息遮罩 -->
      <div id="pause-overlay" class="absolute inset-0 ink-mask z-50 hidden flex items-center justify-center p-3 overflow-y-auto">
        <div class="bg-slate-950/90 border border-amber-500/40 rounded-2xl max-w-sm w-full p-4 shadow-2xl text-center my-auto">
          <div class="text-2xl mb-1">🧘</div>
          <h3 class="text-lg font-black text-amber-300">勒馬調息</h3>
          <p class="text-[11px] text-slate-400 mb-2">暫停奔馳 · 朗讀與回顧篇章</p>
          <div class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-left space-y-2 mb-3">
            <div id="pause-line-title" class="text-xs font-bold text-amber-400"></div>
            <div id="pause-chunks" class="text-base font-black text-white tracking-wide"></div>
            <div id="pause-meaning" class="text-sm text-slate-200 leading-relaxed border-t border-slate-700 pt-2"></div>
            <div id="pause-scroll-preview" class="text-[11px] text-slate-400 leading-relaxed border-t border-slate-700 pt-2 max-h-24 overflow-y-auto scroll-ink"></div>
          </div>
          <button onclick="togglePause()" class="w-full py-2.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl text-sm active:scale-95">
            策馬再戰（Space）
          </button>
        </div>
      </div>
    </div>

    <!-- 破陣詩卷 -->
    <div id="verses-drawer" class="shrink-0 mt-1.5 rounded-xl border border-amber-700/40 bg-gradient-to-b from-[#1a1510]/95 to-slate-950/95 shadow-inner overflow-hidden">
      <div class="flex items-center justify-end px-3 py-1 border-b border-amber-800/30">
        <span id="verses-count" class="text-[10px] text-slate-500 font-bold">0 / 16 聯</span>

    function sanitizePoemTraps() {
      const fallbackByLen = {
        1: ['誤', '錯', '偽', '虛'],
        2: ['錯字', '誤詞', '偽語', '虛詞'],
        3: ['錯別字', '干擾項', '假選項']
      };
      Object.values(POEMS).forEach((poem) => {
        poem.lines.forEach((line) => {
          if (!Array.isArray(line.traps)) line.traps = [];
          line.chunks.forEach((chunk, i) => {
            let trap = line.traps[i];
            if (!trap || trap === chunk) {
              const pool = fallbackByLen[chunk.length] || fallbackByLen[2];
              trap = pool.find((t) => t !== chunk) || (chunk + '誤');
              line.traps[i] = trap;
            }
          });
        });
      });
    }
    sanitizePoemTraps();

    function resolveTrapText(targetText, rawTrap) {
      if (rawTrap && rawTrap !== targetText) return rawTrap;
      if (targetText.length === 1) return targetText === '誤' ? '錯' : '誤';
      if (targetText.length === 2) return targetText === '錯字' ? '誤詞' : '錯字';
      return targetText === '錯別字' ? '干擾項' : '錯別字';

    class SoundEngine {
      constructor() { this.ctx = null; this.muted = false; }
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      playGallop() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.08);
      }
      playCrashSuccess() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(440, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.55, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
      playHurt() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    function resizeCanvas() {

      if (canvas.width !== w || canvas.height !== h) {

    function spawnShatterParticles(x, y, mode) {
      const count = mode === 'ink' ? 28 : 22;
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 9 + 2;
        const isInk = mode === 'ink' ? Math.random() > 0.35 : Math.random() > 0.7;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: Math.random() * 0.035 + 0.02,
          color: isInk ? (Math.random() > 0.5 ? '#0f172a' : '#334155') : (mode === 'wrong' ? '#f43f5e' : '#fbbf24'),
          size: Math.random() * (isInk ? 5 : 3) + 1.5
        });
      }
    }

    function spawnDust(x, y) {
      for (let i = 0; i < 8; i++) {
        particles.push({
          x: x - 10, y: y + 18,
          vx: -Math.random() * 3 - 1,
          vy: -Math.random() * 2,
          life: 1, decay: 0.05 + Math.random() * 0.04,
          color: '#94a3b8', size: Math.random() * 3 + 1
        });
      }
    }

    function pushGhostTrail(x, y) {
      if (combo < 5) return;
      ghostTrails.push({ x, y, life: 0.55 });
      if (ghostTrails.length > 2) ghostTrails.shift();
    }

    function renderFX() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = ghostTrails.length - 1; i >= 0; i--) {
        const g = ghostTrails[i];
        if (!isPaused) g.life -= 0.045;
        if (g.life <= 0) { ghostTrails.splice(i, 1); continue; }
        ctx.globalAlpha = g.life * 0.28;
        ctx.fillStyle = '#C68642';
        const hw = 34;
        const hh = 20;
        ctx.beginPath();
        ctx.ellipse(g.x + hw * 0.42, g.y + hh * 0.55, hw * 0.38, hh * 0.28, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(g.x + hw * 0.72, g.y + hh * 0.38, hw * 0.16, hh * 0.18, 0.25, 0, Math.PI * 2);
        ctx.fill();
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        if (!isPaused) {
          p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life -= p.decay;
        }
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(renderFX);
    }
    requestAnimationFrame(renderFX);

    const MAX_SPEED = 8.5;
    const DEFAULT_GEAR = 0;
    let gearIndex = DEFAULT_GEAR;
    let currentSpeed = SPEED_GEARS[DEFAULT_GEAR].baseSpeed;
    let currentKey = 'mulan';
    let lineIdx = 0;
    let chunkIdx = 0;
    let currentLane = 0;
    let hp = 100;
    let combo = 0;
    let maxCombo = 0;
    let mistakeCount = 0;
    let score = 0;
    let completedVerses = [];
    let mistakes = [];
    let reviewMode = false;
    let reviewQueue = [];
    let reviewPos = 0;

    let flagDistanceX = 0;
    let correctLane = 0;
    let animationFrameId = null;
    let spawnTimer = null;
    let loopToken = 0;
    let isSpawning = false;
    let collisionHandled = false;
    let isPaused = false;
    let ghostTick = 0;

    function blankFor(len) {
      return Array.from({ length: len }, () => '_').join(' ');
    }

    function isVocabPoem(poem) {
      return !!(poem && poem.quiz === 'vocab');
    }

    function poemUnit(poem) {
      return isVocabPoem(poem) ? '詞' : '聯';
    }

    function highlightWord(example, word) {
      const at = example.indexOf(word);
      if (at < 0) return example;
      return `${example.slice(0, at)}<span class="text-amber-300">${word}</span>${example.slice(at + word.length)}`;
    }

    function setFlagText(id, text) {
      const el = document.getElementById(id);
      el.textContent = text;
      const long = text.length > 4;
      el.classList.toggle('text-sm', long);
      el.classList.toggle('md:text-base', long);
      el.classList.toggle('leading-tight', long);
    }

    function currentGear() {
      return SPEED_GEARS[gearIndex];
    }

    function applyRoadDuration() {
      const seconds = parseFloat(currentGear().roadDuration);
      const duration = (Number.isFinite(seconds) ? seconds / layoutSpeedScale() : 1.45) + 's';
      const road = document.getElementById('road-layer');
      document.documentElement.style.setProperty('--road-duration', duration);
      if (!road) return;
      const wasPaused = road.classList.contains('road-paused');
      road.style.animationDuration = duration;
      road.classList.remove('road-scrolling');
      void road.offsetWidth;
      road.classList.add('road-scrolling');
      if (wasPaused || isPaused) road.classList.add('road-paused');
      else road.classList.remove('road-paused');
    }

    function updateHeroVisual() {
      /* 僅保留朝右戰馬，不再疊加騎手 */
    }

    function forceWalkGear() {
      gearIndex = DEFAULT_GEAR;
      combo = 0;
      currentSpeed = SPEED_GEARS[DEFAULT_GEAR].baseSpeed;
      SPEED_GEARS.forEach((g, i) => {
        const btn = document.getElementById('gear-' + i);
        if (!btn) return;
        btn.className = 'gear-btn' + (i === DEFAULT_GEAR ? ' ' + g.activeClass : '');
      });
      applyRoadDuration();
    }

    function setGear(index) {
      const next = Math.max(0, Math.min(SPEED_GEARS.length - 1, Number(index)));
      gearIndex = next;
      SPEED_GEARS.forEach((g, i) => {
        const btn = document.getElementById('gear-' + i);
        if (!btn) return;
        btn.className = 'gear-btn' + (i === gearIndex ? ' ' + g.activeClass : '');
      });
      updateSpeedFromCombo();
      applyRoadDuration();
      updateHUD();
    }

    function shiftGear(delta) {
      setGear(gearIndex + delta);
    }

    function applyTheme() {
      document.getElementById('sky-layer').className = 'absolute inset-0';
      applyStoryMood();
      applyChapterHUD();
    }

    function applyStoryMood() {
      const sky = document.getElementById('sky-layer');
      const fx = document.getElementById('story-fx');
      const wave = document.getElementById('wave-layer');
      const sun = document.getElementById('sun-orb');
      const chip = document.getElementById('scene-chip');
      wave.classList.add('hidden');
      fx.className = 'story-fx absolute inset-0 pointer-events-none';
      let bg = '';
      let chipText = '';
      let sunFill = '#f59e0b';
      let sunOp = '0.25';
      if (currentKey === 'yangxiu') {
        bg = 'linear-gradient(to bottom, #071510 0%, #143028 55%, #4a341c 100%)';
        chipText = '魏帳 · 伴君如伴虎';
        sunFill = '#d6b48a';
        sunOp = '0.28';
      } else if (lineIdx < 4) {
        bg = 'linear-gradient(to bottom, #4a2c12 0%, #a16207 48%, #f6c36b 100%)';
        chipText = '閨房籌備';
        sunFill = '#fbbf24';
        sunOp = '0.55';
      } else if (lineIdx < 8) {
        bg = 'linear-gradient(to bottom, #020617 0%, #0b1d4a 52%, #1e3a8a 100%)';
        chipText = '夜問心跡';
        fx.classList.add('stars');
        sunFill = '#e2e8f0';
        sunOp = '0.9';
      } else if (lineIdx < 12) {
        bg = 'linear-gradient(to bottom, #1a0508 0%, #7f1d1d 50%, #451a12 100%)';
        chipText = '軍帖烽火';
        fx.classList.add('embers');
        sunFill = '#fb7185';
        sunOp = '0.45';
      } else {
        bg = 'linear-gradient(to bottom, #7f1d1d 0%, #e11d48 46%, #fbbf24 100%)';
        chipText = '替父出征';
        fx.classList.add('petals');
        sunFill = '#fde68a';
        sunOp = '0.75';
      }
      sky.style.background = bg;
      chip.textContent = chipText;
      chip.classList.remove('hidden');
      if (sun) {
        sun.setAttribute('fill', sunFill);
        sun.setAttribute('opacity', sunOp);
      }
    }

    function applyChapterHUD() {
      const label = document.getElementById('hp-label');
      const mood = document.getElementById('hp-mood');
      if (currentKey === 'yangxiu') {
        label.textContent = '忌憚';
        label.classList.add('text-rose-300');
        label.classList.remove('text-slate-400');
        mood.classList.remove('hidden');
      } else {
        label.textContent = '心力';
        label.classList.remove('text-rose-300');
        label.classList.add('text-slate-400');
        mood.classList.add('hidden');
      }
    }

    function defeatMessage() {
      return currentKey === 'yangxiu'
        ? '忌憚已極，伴君如伴虎。整頓後再揣摩聖意！'
        : '心力竭盡，整頓戰馬重來！';
    }

    function switchPoem(key) {
      if (isPaused) togglePause(true);
      currentKey = key;
      document.getElementById('tab-mulan').className = key === 'mulan'
        ? 'px-3 py-1 text-xs font-black rounded-t-lg bg-amber-500 text-slate-950 transition-all'
        : 'px-3 py-1 text-xs font-black rounded-t-lg bg-slate-800 text-slate-400 hover:text-white transition-all';
      document.getElementById('tab-yangxiu').className = key === 'yangxiu'
        ? 'px-3 py-1 text-xs font-black rounded-t-lg bg-amber-500 text-slate-950 transition-all'
        : 'px-3 py-1 text-xs font-black rounded-t-lg bg-slate-800 text-slate-400 hover:text-white transition-all';
      document.getElementById('poem-title').textContent = POEMS[key].title;
      updateHeroVisual();
      applyTheme();
      resetGame();
    }

    function resetGame() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
      if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
      loopToken += 1;
      const token = loopToken;
      lineIdx = 0; chunkIdx = 0; currentLane = 0;
      hp = 100; combo = 0; maxCombo = 0; mistakeCount = 0; score = 0;
      completedVerses = [];
      mistakes = [];
      reviewMode = false;
      reviewQueue = [];
      reviewPos = 0;
      collisionHandled = false; isSpawning = false;
      ghostTrails = [];
      forceWalkGear();
      updateLanePosition();
      renderVersesScroll();
      updateHUD();
      updateHorseGlow();
      spawnNextWave();
      gameLoop(token);
    }

    function updateSpeedFromCombo() {
      const gear = currentGear();
      const steps = Math.floor(combo / 2);
      currentSpeed = Math.min(MAX_SPEED, gear.baseSpeed * Math.pow(1.05, steps));
    }

    function resetSpeed() {
      currentSpeed = currentGear().baseSpeed;
    }

    function changeLane(laneIndex) {
      if (isPaused) return;
      if (currentLane === laneIndex) return;
      currentLane = laneIndex;
      audio.playGallop();
      updateLanePosition();
      const horse = document.getElementById('horse-player');
      spawnDust(horse.offsetLeft + 20, horse.offsetTop);
    }

    function updateLanePosition() {
      document.getElementById('horse-player').style.top = currentLane === 0 ? '25%' : '75%';
    }

    function updateHorseGlow() {
      const el = document.getElementById('horse-visual');
      if (!el) return;
      el.classList.toggle('horse-hot', combo >= 3);
      document.getElementById('game-stage').classList.toggle('rhetoric-streak', currentKey === 'mulan' && combo >= 3);
    }

    function calcHitScore() {
      const mult = currentGear().multiplier;
      return Math.round(10 * mult * (1 + combo * 0.1));
    }

    function appendCompletedVerse(line) {
      const text = line.word ? `${line.word}＝${line.chunks[0]}` : line.chunks.join(' / ');
      completedVerses.push(text);
      renderVersesScroll(true);
    }

    function renderVersesScroll(animateLatest) {
      const list = document.getElementById('verses-list');
      const poem = POEMS[currentKey];
      const total = poem.lines.length;
      const unit = poemUnit(poem);
      document.getElementById('verses-count').textContent = `${completedVerses.length} / ${total} ${unit}`;

      if (!completedVerses.length) {
        const empty = isVocabPoem(poem)
          ? '破障成功的詞義將在此點亮成卷……'
          : '破障成功的詩句將在此點亮成卷……';
        list.innerHTML = `<div id="verses-empty" class="text-slate-600 text-xs italic text-center py-5">${empty}</div>`;
        return;
      }

      list.innerHTML = completedVerses.map((v, i) => {
        const isLatest = i === completedVerses.length - 1;
        const cls = isLatest
          ? `verse-line text-emerald-300 font-black ${animateLatest ? 'verse-enter' : ''}`
          : 'verse-line text-slate-500 font-semibold opacity-70';
        return `<div class="${cls}" data-verse-idx="${i}">${i + 1}. ${v}</div>`;
      }).join('');

      const latest = list.querySelector(`[data-verse-idx="${completedVerses.length - 1}"]`);
      if (latest) latest.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function togglePause(forceResume) {
      const reportOpen = !document.getElementById('report-modal').classList.contains('hidden');
      if (reportOpen) return;

      if (forceResume === true) isPaused = false;
      else isPaused = !isPaused;

      const overlay = document.getElementById('pause-overlay');
      const btn = document.getElementById('pause-btn');
      const road = document.getElementById('road-layer');
      const horse = document.getElementById('horse-visual');
      const far = document.getElementById('parallax-far');
      const mid = document.getElementById('parallax-mid');

      if (isPaused) {
        audio.muted = true;
        overlay.classList.remove('hidden');
        btn.textContent = '▶️ 繼續';
        road.classList.add('road-paused');
        horse.classList.add('horse-paused');
        far.classList.add('parallax-paused');
        mid.classList.add('parallax-paused');
        fillPauseCard();
      } else {
        audio.muted = false;
        overlay.classList.add('hidden');
        btn.textContent = '⏸️ 勒馬調息';
        road.classList.remove('road-paused');
        horse.classList.remove('horse-paused');
        far.classList.remove('parallax-paused');
        mid.classList.remove('parallax-paused');
      }
    }

    function fillPauseCard() {
      const poem = POEMS[currentKey];
      const safeIdx = Math.min(lineIdx, poem.lines.length - 1);
      const line = poem.lines[safeIdx];
      const unit = poemUnit(poem);
      document.getElementById('pause-line-title').textContent =
        `${poem.title} · 第 ${safeIdx + 1} ${unit}`;
      if (line.word) {
        const reading = line.reading ? ` · 音：${line.reading}` : '';
        document.getElementById('pause-chunks').textContent = `「${line.word}」＝${line.chunks[0]}`;
        document.getElementById('pause-meaning').innerHTML =
          `<div class="mb-1 text-amber-200/80">${line.roles[0]}${reading}</div>例句：${line.example}。${line.meaning}`;
      } else {
        document.getElementById('pause-chunks').textContent = line.chunks.join('');
        document.getElementById('pause-meaning').textContent = line.meaning;
      }

      const done = completedVerses.map((v, i) => `<div class="text-emerald-400/90">${i + 1}. ${v}</div>`).join('');
      const pending = poem.lines.slice(completedVerses.length).map((l, i) =>
        `<div class="text-slate-600">${completedVerses.length + i + 1}. ${l.word ? '··' : l.chunks.map(() => '··').join(' / ')}</div>`
      ).join('');
      document.getElementById('pause-scroll-preview').innerHTML =
        `<div class="font-bold text-slate-500 mb-1">篇章進度預覽</div>${done || `<div class="text-slate-600">尚無已破${unit}</div>`}${pending}`;
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        togglePause();
        return;
      }
      if (e.key === '[') {
        e.preventDefault();
        shiftGear(-1);
        return;
      }
      if (e.key === ']') {
        e.preventDefault();
        shiftGear(1);
        return;
      }
      if (isPaused) return;
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        e.preventDefault(); changeLane(0);
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        e.preventDefault(); changeLane(1);
      }
    });

    function spawnNextWave() {
      const poem = POEMS[currentKey];
      if (reviewMode) {
        if (reviewPos >= reviewQueue.length) {
          reviewMode = false;
          showVictory();
          return;
        }
        lineIdx = reviewQueue[reviewPos].lineIdx;
        chunkIdx = reviewQueue[reviewPos].chunkIdx;
      } else if (lineIdx >= poem.lines.length) {
        showVictory();
        return;
      }

      applyStoryMood();
      resetFlagVisuals();
      const activeLine = poem.lines[lineIdx];
      updateSentencePreview(activeLine);

      const targetText = activeLine.chunks[chunkIdx];
      const trapText = resolveTrapText(targetText, activeLine.traps[chunkIdx]);
      correctLane = Math.random() > 0.5 ? 0 : 1;

      // 雙重保險：上下道文字必須互異，且正確車道標記對應正解
      if (correctLane === 0) {
        setFlagText('flag-top-text', targetText);
        setFlagText('flag-bottom-text', trapText);
      } else {
        setFlagText('flag-top-text', trapText);
        setFlagText('flag-bottom-text', targetText);
      }

      if (targetText === trapText) {
        console.warn('教材陷阱與正解相同，已強制替換：', targetText);
      }

      flagDistanceX = canvas.width + 120;
      collisionHandled = false;
      isSpawning = true;
    }

    function resetFlagVisuals() {
      ['flag-top-cloth', 'flag-bottom-cloth'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('tear-correct', 'tear-wrong');
        el.style.opacity = '1';
        el.style.transform = '';
        el.style.filter = '';
      });
      document.getElementById('flag-top').style.opacity = '1';
      document.getElementById('flag-bottom').style.opacity = '1';
    }

    function showRhetoricTag(activeLine) {
      const el = document.getElementById('rhetoric-tag');
      if (!activeLine || !activeLine.tag) {
        el.classList.add('hidden');
        return;
      }
      el.textContent = `【${activeLine.tag}】`;
      el.classList.remove('hidden');
      el.classList.toggle('rhetoric-pill-court', currentKey === 'yangxiu');
    }

    function updateSentencePreview(activeLine) {
      const poem = POEMS[currentKey];
      const progress = reviewMode
        ? `專攻 ${reviewPos + 1} / ${reviewQueue.length}`
        : `第 ${lineIdx + 1} / ${poem.lines.length} ${poemUnit(poem)}`;
      document.getElementById('line-progress').textContent = progress;
      showRhetoricTag(activeLine);

      if (activeLine.word) {
        const reading = activeLine.reading ? ` · 音：${activeLine.reading}` : '';
        const role = (activeLine.roles && activeLine.roles[0]) || '詞義';
        document.getElementById('sentence-preview').innerHTML = `
          <span class="basis-full text-center text-[10px] tracking-widest text-amber-500 font-bold">文言字詞</span>
          <span class="text-2xl md:text-3xl text-white tracking-wide">${highlightWord(activeLine.example, activeLine.word)}</span>
          <span class="text-slate-500 mx-1 self-center mb-3">＝</span>
          <span class="inline-flex flex-col items-center mx-0.5">
            <span class="text-amber-400 underline decoration-2 animate-pulse font-extrabold tracking-wider">[ 詞義 ]</span>
            <span class="text-[9px] text-amber-500/90 font-bold bg-amber-500/10 px-1 rounded">${role}${reading}</span>
          </span>`;
        return;
      }

      let html = '';
      activeLine.chunks.forEach((chunk, i) => {
        if (i < chunkIdx) {
          html += `<span class="text-emerald-400 font-extrabold mx-0.5">${chunk}</span>`;
        } else if (i === chunkIdx) {
          html += `<span class="text-amber-400 underline decoration-2 animate-pulse font-extrabold tracking-wider mx-0.5">[ ${blankFor(chunk.length)} ]</span>`;
        } else {
          html += `<span class="text-slate-600 mx-0.5">··</span>`;
        }
        if (i < activeLine.chunks.length - 1) {
          html += `<span class="text-slate-600 mx-1">/</span>`;
        }
      });
      document.getElementById('sentence-preview').innerHTML = html;
    }

    function gameLoop(token) {
      if (token !== loopToken) return;

      if (!isPaused && isSpawning && !collisionHandled) {
        flagDistanceX -= currentSpeed * layoutSpeedScale();

        const flagTop = document.getElementById('flag-top');
        const flagBottom = document.getElementById('flag-bottom');
        flagTop.style.right = 'auto';
        flagBottom.style.right = 'auto';
        flagTop.style.left = `${flagDistanceX}px`;
        flagBottom.style.left = `${flagDistanceX}px`;

        const horse = document.getElementById('horse-player');
        const horseX = horse.offsetLeft + 40;

        ghostTick++;
        if (combo >= 5 && ghostTick % 7 === 0) {
          pushGhostTrail(horse.offsetLeft - 10 - Math.random() * 8, horse.offsetTop);
        }

        if (flagDistanceX <= horseX + 30 && flagDistanceX >= horseX - 30) {
          handleCollision();
        } else if (flagDistanceX < -160) {
          handleMiss();
        }
      }

      if (token !== loopToken) return;
      animationFrameId = requestAnimationFrame(() => gameLoop(token));
    }

    function animateFlagTear(correct) {
      const hitId = correctLane === 0 ? 'flag-top-cloth' : 'flag-bottom-cloth';
      const missId = correctLane === 0 ? 'flag-bottom-cloth' : 'flag-top-cloth';
      const hitWrap = correctLane === 0 ? 'flag-top' : 'flag-bottom';
      const missWrap = correctLane === 0 ? 'flag-bottom' : 'flag-top';

      if (correct) {
        document.getElementById(hitId).classList.add('tear-correct');
        document.getElementById(missWrap).style.opacity = '0.25';
      } else {
        document.getElementById(missId).classList.add('tear-wrong');
        document.getElementById(hitWrap).style.opacity = '0.35';
      }
    }

    function handleCollision() {
      if (collisionHandled || isPaused) return;
      collisionHandled = true;
      isSpawning = false;

      const stage = document.getElementById('game-stage');
      const horse = document.getElementById('horse-player');
      const hx = horse.offsetLeft + 60;
      const hy = horse.offsetTop;

      if (currentLane === correctLane) {
        audio.playCrashSuccess();
        spawnShatterParticles(hx, hy, 'ink');
        animateFlagTear(true);
        stage.classList.remove('shake');
        void stage.offsetWidth;
        stage.classList.add('shake');

        combo++;
        if (combo > maxCombo) maxCombo = combo;
        const gained = calcHitScore();
        score += gained;
        updateSpeedFromCombo();
        updateHorseGlow();

        const mult = currentGear().multiplier;
        const praise = combo >= 3 ? '心流破陣' : '破陣';
        triggerFloatingFeedback(`${praise}！+${gained} (×${mult})`, '#38bdf8');

        const finishingLine = POEMS[currentKey].lines[lineIdx];
        if (reviewMode) {
          reviewPos++;
        } else {
          chunkIdx++;
          if (chunkIdx >= finishingLine.chunks.length) {
            appendCompletedVerse(finishingLine);
            chunkIdx = 0;
            lineIdx++;
          }
        }
      } else {
        audio.playHurt();
        spawnShatterParticles(hx, hy, 'wrong');
        animateFlagTear(false);
        recordMistake();
        mistakeCount++;
        combo = 0;
        hp -= 20;
        resetSpeed();
        updateHorseGlow();
        ghostTrails = [];
        triggerFloatingFeedback('失蹄！-HP', '#f43f5e');

        if (hp <= 0) {
          if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
          alert(defeatMessage());
          forceWalkGear();
          resetGame();
          return;
        }
      }

      updateHUD();
      spawnTimer = setTimeout(spawnNextWave, 420);
    }

    function handleMiss() {
      if (collisionHandled || isPaused) return;
      collisionHandled = true;
      isSpawning = false;
      audio.playHurt();
      recordMistake();
      mistakeCount++;
      combo = 0;
      hp -= 15;
      resetSpeed();
      updateHorseGlow();
      ghostTrails = [];
      triggerFloatingFeedback(isVocabPoem(POEMS[currentKey]) ? '漏過詞義！' : '漏過詩句！', '#f43f5e');

      if (hp <= 0) {
        if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
        alert(defeatMessage());
        forceWalkGear();
        resetGame();
        return;
      }
      updateHUD();
      spawnTimer = setTimeout(spawnNextWave, 320);
    }

    function recordMistake() {
      const line = POEMS[currentKey].lines[lineIdx];
      if (!line) return;
      const id = `${currentKey}:${lineIdx}:${chunkIdx}`;
      if (mistakes.some((item) => item.id === id)) return;
      const correct = line.chunks[chunkIdx];
      mistakes.push({
        id,
        prompt: line.word ? `「${line.word}」${line.example}` : line.chunks.join(''),
        correct,
        tag: line.tag || ''
      });
    }

    function renderMistakeReport() {
      const panel = document.getElementById('mistake-panel');
      const badge = document.getElementById('perfect-badge');
      const retry = document.getElementById('retry-mistakes');
      const list = document.getElementById('mistake-scroll');
      if (!mistakes.length) {
        panel.classList.add('hidden');
        retry.classList.add('hidden');
        badge.classList.remove('hidden');
        list.innerHTML = '';
        return;
      }
      badge.classList.add('hidden');
      panel.classList.remove('hidden');
      retry.classList.remove('hidden');
      list.innerHTML = mistakes.map((item) => `
        <div class="border-b border-slate-800/80 pb-1.5 last:border-0">
          <div class="text-slate-300">${item.tag ? `<span class="text-amber-300">【${item.tag}】</span> ` : ''}${item.prompt}</div>
          <div>正解：<span class="text-emerald-300 font-black">${item.correct}</span></div>
        </div>`).join('');
    }

    function startMistakeReview() {
      if (!mistakes.length) return;
      reviewQueue = mistakes.map((item) => {
        const parts = item.id.split(':');
        return { lineIdx: Number(parts[1]), chunkIdx: Number(parts[2]) };
      });
      mistakes = [];
      reviewPos = 0;
      reviewMode = true;
      hp = 100;
      combo = 0;
      collisionHandled = false;
      isSpawning = false;
      if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
      document.getElementById('report-modal').classList.add('hidden');
      if (isPaused) togglePause(true);
      updateHUD();
      updateHorseGlow();
      loopToken += 1;
      const token = loopToken;
      spawnNextWave();
      gameLoop(token);
    }

    function triggerFloatingFeedback(msg, color) {
      const fb = document.getElementById('feedback-text');
      fb.textContent = msg;
      fb.style.color = color;
      fb.style.opacity = '1';
      fb.style.transform = 'translateY(-60px) scale(1.15)';
      setTimeout(() => {
        fb.style.opacity = '0';
        fb.style.transform = 'translateY(-50%) scale(1)';
      }, 560);
    }

    function updateHUD() {
      document.getElementById('combo-display').textContent = combo;
      document.getElementById('score-display').textContent = score;
      document.getElementById('hp-bar').style.width = `${Math.max(0, hp)}%`;
      document.getElementById('hp-bar').className = hp < 30
        ? 'bg-rose-500 h-full transition-all duration-300'
        : 'bg-gradient-to-r from-emerald-400 to-teal-400 h-full transition-all duration-300';
    }

    function showVictory() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = null;
      if (spawnTimer) { clearTimeout(spawnTimer); spawnTimer = null; }
      loopToken += 1;
      isSpawning = false;
      if (isPaused) togglePause(true);
      document.getElementById('stat-combo').textContent = `${maxCombo} 次連斬`;
      document.getElementById('stat-score').textContent = `${score} 分`;
      const total = POEMS[currentKey].lines.length * 2.5;
      const acc = Math.max(10, Math.round((total / (total + mistakeCount)) * 100));
      const accLabel = isVocabPoem(POEMS[currentKey]) ? '詞義避障成功' : '錯別字避障成功';
      document.getElementById('stat-accuracy').textContent = `${acc}% (${accLabel})`;
      renderMistakeReport();
      document.getElementById('report-modal').classList.remove('hidden');
    }

    function restartGame() {
      document.getElementById('report-modal').classList.add('hidden');
      forceWalkGear();
      switchPoem(currentKey === 'mulan' ? 'yangxiu' : 'mulan');
    }

    window.switchPoem = switchPoem;
    window.changeLane = changeLane;
    window.restartGame = restartGame;
    window.togglePause = togglePause;
    window.setGear = setGear;
    window.startMistakeReview = startMistakeReview;

    document.querySelectorAll('#gear-bar button').forEach((btn) => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const idx = Number(btn.id.replace('gear-', ''));
        setGear(idx);
      });
    });

    window.onload = () => {
      syncStageLayout();
      applyTheme();
      forceWalkGear();
      updateHeroVisual();
      switchPoem('mulan');
    };
  </script>
</body>
</html>
